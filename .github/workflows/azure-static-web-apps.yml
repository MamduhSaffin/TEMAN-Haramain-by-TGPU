name: TEMAN Haramain — Azure Static Web Apps

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  test_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Test TEMAN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run regression tests
        run: npm run test
      - name: Verify app build
        run: npm run build

  build_and_deploy_job:
    needs: test_job
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy TEMAN
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Prepare pinned Haramain offline map packs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/maps
          SATU_MAP_SHA="59ca2c8535b83b77e6f41ab80584e29cd5c05794"
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/MamduhSaffin/SATU/${SATU_MAP_SHA}/public/maps/makkah.pmtiles" --output public/maps/makkah.pmtiles
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/MamduhSaffin/SATU/${SATU_MAP_SHA}/public/maps/madinah.pmtiles" --output public/maps/madinah.pmtiles
          test -s public/maps/makkah.pmtiles
          test -s public/maps/madinah.pmtiles
          ls -lh public/maps/*.pmtiles

      - name: Build and deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          api_location: api
          output_location: dist
          app_build_command: npm run build
          api_build_command: npm run build

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Preview Environment
    steps:
      - name: Close pull request environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
