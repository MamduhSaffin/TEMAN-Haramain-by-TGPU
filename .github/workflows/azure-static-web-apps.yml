name: TEMAN Haramain — Azure Static Web Apps

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: teman-swa-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Test TEMAN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run regression tests
        run: npm run test
      - name: Verify app build
        run: npm run build

  build_and_deploy_job:
    needs: test_job
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy TEMAN
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Prepare pinned Haramain offline map packs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/maps
          SATU_MAP_SHA="59ca2c8535b83b77e6f41ab80584e29cd5c05794"
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/MamduhSaffin/SATU/${SATU_MAP_SHA}/public/maps/makkah.pmtiles" --output public/maps/makkah.pmtiles
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/MamduhSaffin/SATU/${SATU_MAP_SHA}/public/maps/madinah.pmtiles" --output public/maps/madinah.pmtiles
          test -s public/maps/makkah.pmtiles
          test -s public/maps/madinah.pmtiles
          ls -lh public/maps/*.pmtiles

      - name: Build and deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          api_location: api
          output_location: dist
          app_build_command: npm run build
          api_build_command: npm run build

      - name: Verify live production domain
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://teman.tgpu.my"

          fetch_with_retry() {
            local url="$1"
            local output="$2"
            for attempt in {1..12}; do
              if curl --fail --silent --show-error --location --max-time 20 "$url" --output "$output"; then
                return 0
              fi
              if [ "$attempt" -lt 12 ]; then sleep 5; fi
            done
            return 1
          }

          fetch_with_retry "$BASE/" /tmp/teman-index.html
          grep -Fq '<title>TEMAN Haramain by TGPU</title>' /tmp/teman-index.html

          fetch_with_retry "$BASE/manifest.webmanifest" /tmp/teman-manifest.json
          grep -Fq '"name": "TEMAN Haramain by TGPU"' /tmp/teman-manifest.json

          fetch_with_retry "$BASE/robots.txt" /tmp/teman-robots.txt
          grep -Fq 'Sitemap: https://teman.tgpu.my/sitemap.xml' /tmp/teman-robots.txt

          fetch_with_retry "$BASE/sitemap.xml" /tmp/teman-sitemap.xml
          grep -Fq '<loc>https://teman.tgpu.my/</loc>' /tmp/teman-sitemap.xml

          fetch_with_retry "$BASE/sw.js" /tmp/teman-sw.js
          grep -Fq "const CACHE = 'teman-shell-v6';" /tmp/teman-sw.js
          grep -Fq "url.pathname.startsWith('/api/')" /tmp/teman-sw.js

          curl --silent --show-error --location --max-time 20 \
            --dump-header /tmp/teman-status-headers.txt \
            --output /tmp/teman-status-body.json \
            "$BASE/api/family/status?family=production-smoke-check&token=invalid" || true
          grep -Eiq '^cache-control:.*no-store' /tmp/teman-status-headers.txt

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME"
          QA_DIR="$RUNNER_TEMP/teman-live-qa"
          rm -rf "$QA_DIR"
          mkdir -p "$QA_DIR"

          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
            --window-size=390,844 --user-data-dir=/tmp/teman-chrome-mobile-shot \
            --screenshot="$QA_DIR/teman-mobile.png" "$BASE/"

          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
            --window-size=1440,1000 --user-data-dir=/tmp/teman-chrome-desktop-shot \
            --screenshot="$QA_DIR/teman-desktop.png" "$BASE/"

          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
            --window-size=390,844 --user-data-dir=/tmp/teman-chrome-mobile \
            --dump-dom "$BASE/" > "$QA_DIR/rendered-mobile.html"
          grep -Fq 'BANTU SAYA SEKARANG' "$QA_DIR/rendered-mobile.html"
          grep -Fq 'teman-bottom-nav' "$QA_DIR/rendered-mobile.html"

      - name: Upload live QA screenshots
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: teman-live-qa
          path: ${{ runner.temp }}/teman-live-qa/
          retention-days: 3
          if-no-files-found: warn

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Preview Environment
    steps:
      - name: Close pull request environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
